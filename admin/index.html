<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earn App - Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; color: #1a1a2e; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

    /* Login */
    .login-box { max-width: 400px; margin: 80px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
    .login-box h2 { text-align: center; margin-bottom: 20px; color: #6c63ff; }
    .login-box input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
    .login-box button { width: 100%; padding: 12px; background: #6c63ff; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .login-box button:hover { background: #5549e0; }
    .error { color: #e74c3c; text-align: center; margin-top: 10px; }

    /* Header */
    .header { background: #16213e; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h2 { font-size: 20px; }
    .header button { background: #e74c3c; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin: 20px 0; }
    .stat-card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.05); text-align: center; }
    .stat-card .num { font-size: 28px; font-weight: 700; color: #6c63ff; }
    .stat-card .label { color: #666; margin-top: 5px; }

    /* Tabs */
    .tabs { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
    .tab { padding: 10px 20px; background: #fff; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; font-size: 15px; }
    .tab.active { background: #6c63ff; color: #fff; border-color: #6c63ff; }

    /* Tables */
    .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.05); padding: 20px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #f8f9fa; color: #555; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge.pending { background: #fff3cd; color: #856404; }
    .badge.approved { background: #d4edda; color: #155724; }
    .badge.rejected { background: #f8d7da; color: #721c24; }
    .btn { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; margin: 2px; }
    .btn-approve { background: #28a745; color: #fff; }
    .btn-reject { background: #dc3545; color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .empty { text-align: center; color: #999; padding: 30px; }
    .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
    .filter-bar select { padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div id="loginView" class="container">
    <div class="login-box">
      <h1>🔐 Admin Panel</h1>
      <input type="text" id="loginUser" placeholder="Username">
      <input type="password" id="loginPass" placeholder="Password">
      <button onclick="login()">Login</button>
      <div class="error" id="loginError"></div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="mainView" class="hidden">
    <div class="header">
      <h2>📊 Earn App Admin</h2>
      <button onclick="logout()">Logout</button>
    </div>
    <div class="container">
      <div class="stats" id="statsRow"></div>

      <div class="tabs">
        <div class="tab active" data-tab="withdraws" onclick="switchTab('withdraws')">💸 Withdraw Requests</div>
        <div class="tab" data-tab="users" onclick="switchTab('users')">👥 Users</div>
      </div>

      <!-- Withdraws -->
      <div id="tab-withdraws" class="card">
        <div class="filter-bar">
          <h3>Withdraw Requests</h3>
          <select id="statusFilter" onchange="loadWithdraws()">
            <option value="">All</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        <table>
          <thead>
            <tr><th>ID</th><th>User</th><th>Amount</th><th>Method</th><th>Mobile</th><th>Status</th><th>Date</th><th>Action</th></tr>
          </thead>
          <tbody id="withdrawBody"></tbody>
        </table>
      </div>

      <!-- Users -->
      <div id="tab-users" class="card hidden">
        <h3>All Users</h3>
        <table>
          <thead>
            <tr><th>ID</th><th>Name</th><th>Phone</th><th>Balance</th><th>Total Earned</th><th>Ads</th><th>Joined</th></tr>
          </thead>
          <tbody id="userBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API = '';
    let token = localStorage.getItem('admin_token') || '';

    function $(id) { return document.getElementById(id); }

    function showLogin() {
      $('loginView').style.display = 'block';
      $('mainView').style.display = 'none';
    }
    function showMain() {
      $('loginView').style.display = 'none';
      $('mainView').style.display = 'block';
    }

    async function api(path, method = 'GET', body = null) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (token) opts.headers['Authorization'] = 'Bearer ' + token;
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(API + path, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function login() {
      const username = $('loginUser').value.trim();
      const password = $('loginPass').value;
      try {
        const data = await api('/api/admin/login', 'POST', { username, password });
        token = data.token;
        localStorage.setItem('admin_token', token);
        $('loginError').textContent = '';
        init();
      } catch (e) {
        $('loginError').textContent = e.message;
      }
    }

    function logout() {
      token = '';
      localStorage.removeItem('admin_token');
      showLogin();
    }

    async function loadStats() {
      try {
        const s = await api('/api/admin/stats');
        $('statsRow').innerHTML = `
          <div class="stat-card"><div class="num">${s.users}</div><div class="label">Total Users</div></div>
          <div class="stat-card"><div class="num">${s.pending}</div><div class="label">Pending</div></div>
          <div class="stat-card"><div class="num">${s.approved}</div><div class="label">Approved</div></div>
          <div class="stat-card"><div class="num">৳${s.totalPaid}</div><div class="label">Total Paid</div></div>`;
      } catch (e) { console.error(e); }
    }

    async function loadWithdraws() {
      const status = $('statusFilter').value;
      const q = status ? '?status=' + status : '';
      try {
        const rows = await api('/api/admin/withdraws' + q);
        const body = $('withdrawBody');
        if (!rows.length) { body.innerHTML = '<tr><td colspan="8" class="empty">No requests found</td></tr>'; return; }
        body.innerHTML = rows.map(w => `
          <tr>
            <td>#${w.id}</td>
            <td>${w.name}<br><small>${w.user_phone}</small></td>
            <td><b>৳${w.amount}</b></td>
            <td>${w.method.toUpperCase()}</td>
            <td>${w.mobile}</td>
            <td><span class="badge ${w.status}">${w.status}</span></td>
            <td>${w.created_at}</td>
            <td>
              ${w.status === 'pending' ? `
                <button class="btn btn-approve" onclick="approve(${w.id})">✓ Approve</button>
                <button class="btn btn-reject" onclick="reject(${w.id})">✗ Reject</button>
              ` : '—'}
            </td>
          </tr>`).join('');
      } catch (e) { console.error(e); }
    }

    async function approve(id) {
      if (!confirm('Approve this withdraw request?')) return;
      try { await api('/api/admin/withdraws/' + id + '/approve', 'POST'); loadWithdraws(); loadStats(); }
      catch (e) { alert(e.message); }
    }
    async function reject(id) {
      if (!confirm('Reject this request? Balance will be refunded.')) return;
      try { await api('/api/admin/withdraws/' + id + '/reject', 'POST'); loadWithdraws(); loadStats(); }
      catch (e) { alert(e.message); }
    }

    async function loadUsers() {
      try {
        const rows = await api('/api/admin/users');
        const body = $('userBody');
        if (!rows.length) { body.innerHTML = '<tr><td colspan="7" class="empty">No users yet</td></tr>'; return; }
        body.innerHTML = rows.map(u => `
          <tr>
            <td>#${u.id}</td>
            <td>${u.name}</td>
            <td>${u.phone}</td>
            <td><b>৳${u.balance}</b></td>
            <td>৳${u.total_earned}</td>
            <td>${u.ads_watched}</td>
            <td>${u.created_at}</td>
          </tr>`).join('');
      } catch (e) { console.error(e); }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
      $('tab-withdraws').classList.toggle('hidden', tab !== 'withdraws');
      $('tab-users').classList.toggle('hidden', tab !== 'users');
    }

    function init() {
      showMain();
      loadStats();
      loadWithdraws();
      loadUsers();
    }

    // Auto-login if token exists
    if (token) { init(); } else { showLogin(); }
  </script>
</body>
</html>
