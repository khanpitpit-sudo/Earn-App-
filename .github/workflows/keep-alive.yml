# Keep-Alive - Render free service never sleeps
#
# Why this is needed:
#   A Render free Web Service spins down after 15 minutes of inactivity.
#   Waking it up takes 30-50 seconds, and while spinning down the server
#   gets SIGTERM, which can wipe the ephemeral filesystem.
#
# This workflow pings your service every 10 minutes, so the server stays
# awake -> logins are always fast and the database file is safer.

name: keep-alive

on:
  schedule:
    # every 10 minutes (the shortest practical GitHub Actions interval)
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Earn App backend
        run: |
          URL="https://earn-app-11.onrender.com/api/health"
          echo "Pinging $URL ..."
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/out.txt -m 90 -w '%{http_code}' "$URL" || echo "000")
            echo "attempt $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/out.txt
              exit 0
            fi
            sleep 15
          done
          echo "Backend did not answer with 200 after 3 tries"
          exit 1
